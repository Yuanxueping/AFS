<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的博客</title>
  <meta name="description" content="分享知识与见解">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="site-logo" id="site-logo">我的博客</a>
    <div class="header-search">
      <div class="search-box">
        <input type="text" id="header-search-input" placeholder="搜索文章…" autocomplete="off">
        <button id="header-search-btn" title="搜索">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
      </div>
    </div>
    <nav class="header-nav">
      <a href="admin/index.html" class="btn-admin">管理后台</a>
    </nav>
  </div>
</header>

<!-- ── Main ───────────────────────────────────────────────────────────────── -->
<main>
  <div class="container main-layout">

    <!-- Articles area -->
    <section>
      <div id="search-info" style="display:none; margin-bottom:1rem;">
        <span id="search-info-text" style="color:var(--text-muted);font-size:.9rem;"></span>
        <a href="index.html" style="font-size:.85rem;margin-left:.75rem;">清除搜索</a>
      </div>

      <div id="articles-container">
        <div class="loading">
          <div class="spinner"></div>
          <p>加载文章中…</p>
        </div>
      </div>

      <div id="pagination-container" class="pagination"></div>
    </section>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="widget">
        <h3 class="widget-title">文章分类</h3>
        <ul class="category-list" id="category-list">
          <li><a href="#" data-cat="" class="active">全部文章 <span class="cat-count" id="total-count">0</span></a></li>
        </ul>
      </div>
      <div class="widget">
        <h3 class="widget-title">关于本站</h3>
        <p id="site-description" style="font-size:.875rem;color:var(--text-muted);line-height:1.6;">分享知识与见解</p>
      </div>
    </aside>

  </div>
</main>

<!-- ── Footer ─────────────────────────────────────────────────────────────── -->
<footer class="site-footer">
  <div class="container">
    <p id="footer-text">© 2024 我的博客. 保留所有权利.</p>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
