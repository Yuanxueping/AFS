<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <!-- Google AFS / CSA -->
  <script async="async" src="https://www.google.com/adsense/search/ads.js"></script>
  <script type="text/javascript" charset="utf-8">
    (function(g,o){g[o]=g[o]||function(){(g[o]['q']=g[o]['q']||[]).push(
      arguments)},g[o]['t']=1*new Date})(window,'_googCsa');
  </script>
</head>
<body>

<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="site-logo" id="site-logo">
      <span class="logo-icon">◈</span>
      <span class="logo-text">The Daily Insight</span>
    </a>
    <div class="header-search-compact">
      <div class="search-box-compact">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="header-search-input" placeholder="Search articles…" autocomplete="off">
        <button id="header-search-btn">Search</button>
      </div>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="index.html?cat=Technology" class="nav-link">Tech</a>
      <a href="index.html?cat=Health" class="nav-link">Health</a>
      <a href="index.html?cat=Finance" class="nav-link">Finance</a>
    </nav>
  </div>
</header>

<!-- ── Main ───────────────────────────────────────────────────────────────── -->
<main>
  <div class="container">

    <div class="results-header">
      <a href="javascript:history.back()" class="results-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Back
      </a>
      <div class="results-query">Results for: <span id="query-display"></span></div>
      <p id="results-subtitle" style="color:var(--text-muted);font-size:.875rem;margin-top:.25rem;"></p>
    </div>

    <!-- Loading -->
    <div id="results-loading" class="loading">
      <div class="spinner"></div>
      <p>Loading results…</p>
    </div>

    <!-- Results layout -->
    <div id="results-body" style="display:none;" class="results-layout">

      <div>
        <!-- AFS Ad — Google renders ads inside this container -->
        <div class="results-ad-section" id="results-ad-section">
          <div id="afscontainer1"></div>
        </div>

        <!-- Related Articles -->
        <h2 class="related-articles-title">Related Articles</h2>
        <div id="related-articles-main">
          <div class="loading" style="padding:1rem 0;">
            <div class="spinner" style="width:1.5rem;height:1.5rem;border-width:2px;"></div>
          </div>
        </div>
      </div>

      <!-- Sidebar -->
      <aside>
        <div class="widget" id="more-terms-widget" style="display:none;">
          <h3 class="widget-title">More Searches</h3>
          <div class="search-chips" id="more-terms-chips"
               style="flex-direction:column;gap:.4rem;"></div>
        </div>
      </aside>

    </div>
  </div>
</main>

<!-- ── Footer ─────────────────────────────────────────────────────────────── -->
<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-brand">
      <a href="index.html" class="site-logo footer-logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text" id="footer-site-name">The Daily Insight</span>
      </a>
    </div>
    <div class="footer-links">
      <a href="index.html">Home</a>
    </div>
  </div>
  <div class="footer-bottom">
    <p id="footer-text">© 2025 The Daily Insight. All rights reserved.</p>
  </div>
</footer>

<script src="js/results.js"></script>
</body>
</html>
